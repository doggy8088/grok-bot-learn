<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>「1+12」多崗協同</title>
<style>
*{box-sizing:border-box}
html,body{width:1200px;height:760px;margin:0;overflow:hidden}
body{background:#f7f1e7;color:#20201d;font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}
.canvas{width:1200px;height:760px;padding:30px 48px 38px}
.top{height:112px;display:flex;align-items:center;border-bottom:1px solid #d8cfc1}
h1{font-size:36px;letter-spacing:-1.5px;line-height:1;margin:0;font-weight:750}
.bot{width:108px;height:108px;object-fit:contain;margin-left:auto}
.route{height:118px;display:grid;grid-template-columns:1fr 56px 1.28fr 56px 1fr;align-items:center;padding:14px 65px 10px}
.node{height:78px;border:1px solid #d8cfc1;border-radius:22px;background:#fffdf8;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.node strong{font-size:21px;line-height:1.2;font-weight:720}.node span{font-size:15px;line-height:1.35;margin-top:5px;color:#59554f}
.captain{background:#e9aa45;border-color:#d8932e}.captain span{color:#372615}
.arrow{height:2px;background:#d8932e;position:relative;margin:0 12px}.arrow:after{content:"";position:absolute;right:-1px;top:-5px;width:10px;height:10px;border-top:2px solid #d8932e;border-right:2px solid #d8932e;transform:rotate(45deg)}
.rule{height:54px;border:1px solid #d8cfc1;border-radius:18px;background:#fffdf8;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:650;letter-spacing:.1px}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:155px 155px;gap:14px;margin-top:14px}
.card{border:1px solid #d8cfc1;border-radius:22px;background:#fffdf8;padding:17px 22px;display:grid;grid-template-columns:34px 1fr;column-gap:13px;overflow:hidden}
.num{width:32px;height:32px;border-radius:50%;background:#e9aa45;color:#3b2917;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:760;grid-row:1 / span 2}
.card h2{margin:2px 0 7px;font-size:21px;line-height:1.15;font-weight:750}.steps{font-size:16px;line-height:1.55;color:#3f3c37}.steps b{font-weight:750;color:#20201d}.bottom{height:58px;margin-top:14px;border:1px solid #d8cfc1;border-radius:18px;background:#20201d;color:#fffaf0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;letter-spacing:.1px}
</style>
</head>
<body>
<main class="canvas">
<header class="top">
<h1>「1+12」多崗協同</h1>
<img class="bot" src="bots/hexagone-ambre.png" alt="">
</header>
<section class="route" aria-label="協同架構">
<div class="node"><strong>業務負責人</strong><span>只對接出海船長</span></div>
<div class="arrow"></div>
<div class="node captain"><strong>出海船長</strong><span>統籌排程 12 個業務崗位</span></div>
<div class="arrow"></div>
<div class="node"><strong>12 個業務崗位</strong><span>單線彙報，船長收攏結果</span></div>
</section>
<div class="rule">所有崗位嚴格禁止直接改動店鋪後台，只輸出待批清單供人工確認。</div>
<section class="grid" aria-label="交接鏈">
<article class="card"><div class="num">1</div><h2>巡檢鏈</h2><div class="steps"><b>助理</b>上報例外與證據<br>派給資料或廣告崗位做歸因分析</div></article>
<article class="card"><div class="num">2</div><h2>選品鏈</h2><div class="steps"><b>海盜</b>提交機會報告，<b>財務</b>測算單品利潤<br>船長整理為立項建議書提報給人</div></article>
<article class="card"><div class="num">3</div><h2>上新鏈</h2><div class="steps"><b>文案</b>出草稿，<b>設計</b>出圖，<b>守門員</b>審核<br>船長終檢後交給人確認，由人工在後台發表</div></article>
<article class="card"><div class="num">4</div><h2>覆盤鏈</h2><div class="steps">收齊各崗位經驗，<b>覆盤機器人</b>寫週報並更新經驗庫<br>據此編排下週計劃</div></article>
</section>
<div class="bottom">人只對接「出海船長」；由船長派活並收攏結果。</div>
</main>
</body>
</html>
