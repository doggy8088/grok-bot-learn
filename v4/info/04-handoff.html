<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>一次好的交接</title>
<style>
  * { box-sizing: border-box; }
  html, body { width: 1200px; height: 760px; margin: 0; overflow: hidden; }
  body {
    background: #f8f7f3;
    color: #1d1c1a;
    font-family: "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  main { width: 1200px; height: 760px; padding: 48px 58px 42px; }
  .heading { height: 120px; position: relative; }
  h1 { margin: 0; font-size: 38px; line-height: 1.18; letter-spacing: -1.2px; font-weight: 760; }
  .intro { margin: 15px 0 0; font-size: 18px; line-height: 1.6; color: #55504a; }
  .bot { position: absolute; right: 5px; top: -14px; width: 112px; height: 112px; object-fit: contain; }
  .flow {
    height: 386px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    align-items: stretch;
  }
  .step {
    position: relative;
    background: #fffefd;
    border: 1px solid #e3dfd8;
    border-radius: 24px;
    padding: 26px 20px 22px;
    display: flex;
    flex-direction: column;
  }
  .step:not(:last-child)::after {
    content: "";
    position: absolute;
    z-index: 2;
    top: 50%;
    right: -13px;
    width: 10px;
    height: 10px;
    border-top: 2px solid #e05b42;
    border-right: 2px solid #e05b42;
    transform: rotate(45deg);
    background: #f8f7f3;
  }
  .num { color: #e05b42; font-size: 16px; line-height: 1; font-weight: 760; letter-spacing: .08em; }
  h2 { margin: 19px 0 15px; font-size: 21px; line-height: 1.3; letter-spacing: -.4px; font-weight: 740; }
  .rule { width: 32px; height: 3px; border-radius: 99px; background: #1d1c1a; margin-bottom: 18px; }
  .copy { margin: 0; color: #59544e; font-size: 16px; line-height: 1.72; }
  .result {
    height: 128px;
    margin-top: 26px;
    border-radius: 24px;
    border: 1px solid #e3dfd8;
    background: #1d1c1a;
    color: #fffdf8;
    display: flex;
    align-items: center;
    padding: 24px 30px;
  }
  .result-mark { color: #f09a82; font-size: 16px; font-weight: 700; letter-spacing: .12em; margin-right: 27px; }
  .result strong { font-size: 27px; letter-spacing: -.5px; font-weight: 720; }
  .result span { margin-left: 22px; color: #d7d1c9; font-size: 16px; }
</style>
</head>
<body>
<main>
  <section class="heading">
    <h1>一次好的交接</h1>
    <p class="intro">你發出的每一條訊息，本質上都是一次工作交接。</p>
    <img class="bot" src="bots/galet-rouge.png" alt="">
  </section>
  <section class="flow" aria-label="好請求的五要素">
    <article class="step">
      <div class="num">01</div>
      <h2>目標與具體動作</h2>
      <div class="rule"></div>
      <p class="copy">動作必須落到具體的操作動詞上。</p>
    </article>
    <article class="step">
      <div class="num">02</div>
      <h2>資訊來源與<br>訪問範圍</h2>
      <div class="rule"></div>
      <p class="copy">交代清楚從哪裡獲取資料，同時明確排除哪些區域。</p>
    </article>
    <article class="step">
      <div class="num">03</div>
      <h2>決策邊界與<br>審批紅線</h2>
      <div class="rule"></div>
      <p class="copy">哪些步驟可以全自動執行，哪些步驟絕對不能越界。</p>
    </article>
    <article class="step">
      <div class="num">04</div>
      <h2>交付形態與<br>存放路徑</h2>
      <div class="rule"></div>
      <p class="copy">最終要交出什麼格式的成果，存放在什麼位置。</p>
    </article>
    <article class="step">
      <div class="num">05</div>
      <h2>事實與推測分離<br>及例外處理</h2>
      <div class="rule"></div>
      <p class="copy">將直接客觀事實與推匯出的判斷嚴格區分開。</p>
    </article>
  </section>
  <section class="result">
    <div class="result-mark">做完怎麼驗收</div>
    <strong>能夠直接驗收的交付物</strong>
    <span>記錄具體錯誤並繼續執行剩餘項目</span>
  </section>
</main>
</body>
</html>
