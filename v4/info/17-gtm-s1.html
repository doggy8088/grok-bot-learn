<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{width:1200px;height:760px;margin:0;overflow:hidden}body{background:#f7f1e7;color:#20201d;font-family:"PingFang SC","Noto Sans CJK SC",sans-serif}.page{height:760px;padding:42px 52px 40px}.head{height:128px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9d0c3}.head h1{margin:0;font-size:38px;letter-spacing:-1.5px;line-height:1.15;font-weight:760}.bot{width:112px;height:112px;object-fit:contain;flex:none;margin-right:23px}.diagram{height:397px;padding-top:30px;display:grid;grid-template-columns:278px 82px 360px 82px 1fr;align-items:center}.card{border:1px solid #d9d0c3;border-radius:23px;background:#fffaf1}.old{height:245px;padding:29px 26px;background:#eee8dd}.old h2,.chief h2,.roles h2{margin:0 0 19px;font-size:20px;line-height:1.2}.old p{font-size:16px;line-height:1.65;margin:0}.line{height:2px;background:#d8734c;position:relative}.line:after{content:"";position:absolute;right:-1px;top:-5px;border-left:11px solid #d8734c;border-top:6px solid transparent;border-bottom:6px solid transparent}.chief{height:313px;padding:27px 29px;border:2px solid #d8734c;box-shadow:0 8px 0 rgba(216,115,76,.10)}.chief h2{font-size:25px;color:#b64d2d}.chief p{font-size:16px;line-height:1.55;margin:0 0 17px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border-radius:12px;background:#f4dfd4;color:#873a26;padding:8px 10px;font-size:15px;font-weight:650;white-space:nowrap}.roles{height:245px;padding:28px 25px}.role{background:#e1eee9;border-radius:14px;padding:11px 14px;margin-top:10px;font-size:16px;font-weight:650}.bottom{height:140px;border:1px solid #d9d0c3;border-radius:23px;background:#fffaf1;display:grid;grid-template-columns:175px 1fr 1fr;padding:21px 24px;gap:20px}.bottom h2{margin:3px 0;font-size:20px;line-height:1.3}.step{border-left:3px solid #79a99d;padding:0 0 0 17px}.step strong{display:block;font-size:17px;margin:1px 0 8px}.step p{font-size:15px;line-height:1.45;margin:0;color:#4a4842}
</style>
</head>
<body>
<main class="page">
<header class="head"><h1>幕僚長：協作網路的入口</h1><img class="bot" src="bots/galet-encre.png"></header>
<section class="diagram">
<article class="card old"><h2>沒有統一排程入口</h2><p>把多個專員同時放進系統，等於招募了一群沒有主管的初級員工。</p><p>傳遞上下文的工作，全部落回你的頭上。</p></article>
<div class="line"></div>
<article class="card chief"><h2>唯一對外的交互入口</h2><p>接收你的總體目標，判斷下一步。</p><div class="choices"><span class="choice">自己直接處理</span><span class="choice">分派給下游專職角色</span><span class="choice">掛起等待人工批准</span></div></article>
<div class="line"></div>
<article class="card roles"><h2>下游專職角色</h2><div class="role">獨立的雲端電腦環境</div><div class="role">長期記憶</div></article>
</section>
<section class="bottom"><h2>合理的搭建順序</h2><div class="step"><strong>第一週</strong><p>先上線一名幕僚長，只與它溝通。</p><p>每一次糾正的輸出問題，都可以固化為規則。</p></div><div class="step"><strong>規則和邊界穩定後</strong><p>後續增加的專職角色，直接繼承這套行為規範。</p><p>避免重複除錯。</p></div></section>
</main>
</body>
</html>
